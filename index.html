<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#060910" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="/app-icon-192.png" />
  <link rel="apple-touch-icon" href="/app-icon-192.png" />
  <title>Burlington Dark Skies — Family Space Explorer &amp; NexStar 8SE</title>

  <!-- Google Fonts & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800;900&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0" rel="stylesheet" />

  <!-- Compiled Tailwind + Astral Dark Design System -->
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="bg-dark-surface text-dark-on-surface font-body min-h-screen antialiased select-none selection:bg-accent selection:text-dark-surface overflow-x-hidden">
  <!-- Main Mobile Shell Frame -->
  <div id="app-shell" class="max-w-md mx-auto min-h-screen relative bg-dark-surface shadow-2xl border-x border-dark-outline/30">
    <!-- Active Screen Mount Container -->
    <div id="screen-root" class="w-full min-h-screen"></div>

    <!-- Sleek Floating-Glass 5-Tab Bottom Navigation Bar -->
    <nav
      id="app-bottom-nav"
      data-shell-nav="true"
      aria-label="Primary Navigation"
      class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-dark-surface-container/95 backdrop-blur-xl border-t border-dark-outline/80 px-3 pt-2 pb-[max(0.55rem,env(safe-area-inset-bottom))] grid grid-cols-5 z-50"
    >
      <button type="button" data-nav="dashboard" class="nav-tab-btn flex flex-col items-center justify-center gap-0.5 py-1 rounded-xl text-accent tap-scale">
        <span class="material-symbols-outlined text-[22px] nav-tab-icon" style="font-variation-settings: 'FILL' 1;">nights_stay</span>
        <span class="font-label text-[10px] font-bold tracking-wide nav-tab-label">Tonight</span>
      </button>
      <button type="button" data-nav="explore" class="nav-tab-btn flex flex-col items-center justify-center gap-0.5 py-1 rounded-xl text-dark-on-surface-variant hover:text-accent tap-scale">
        <span class="material-symbols-outlined text-[22px] nav-tab-icon">explore</span>
        <span class="font-label text-[10px] font-medium tracking-wide nav-tab-label">Explore</span>
      </button>
      <button type="button" data-nav="optics" class="nav-tab-btn flex flex-col items-center justify-center gap-0.5 py-1 rounded-xl text-dark-on-surface-variant hover:text-accent tap-scale">
        <span class="material-symbols-outlined text-[22px] nav-tab-icon">center_focus_strong</span>
        <span class="font-label text-[10px] font-medium tracking-wide nav-tab-label">8SE Scope</span>
      </button>
      <button type="button" data-nav="map" class="nav-tab-btn flex flex-col items-center justify-center gap-0.5 py-1 rounded-xl text-dark-on-surface-variant hover:text-accent tap-scale">
        <span class="material-symbols-outlined text-[22px] nav-tab-icon">satellite_alt</span>
        <span class="font-label text-[10px] font-medium tracking-wide nav-tab-label">Sky Map</span>
      </button>
      <button type="button" data-nav="logbook" class="nav-tab-btn flex flex-col items-center justify-center gap-0.5 py-1 rounded-xl text-dark-on-surface-variant hover:text-accent tap-scale">
        <span class="material-symbols-outlined text-[22px] nav-tab-icon">auto_stories</span>
        <span class="font-label text-[10px] font-medium tracking-wide nav-tab-label">Journal</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
